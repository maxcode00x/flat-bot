name: Поиск жилья

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flat-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Проверить объявления
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Сохранить просмотренные
        if: always()
        run: |
          [ -f seen.json ] || exit 0
          git config user.name "flat-bot"
          git config user.email "flat-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "seen: $(date -u +%F\ %H:%M)" && git pull --rebase && git push)
