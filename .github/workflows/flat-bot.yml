name: Поиск жилья

on:
  schedule:
    - cron: "*/10 * * * *"   # каждые 10 минут (GitHub может запускать с опозданием на 5–15 мин)
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write             # чтобы сохранять seen.json

concurrency:
  group: flat-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Проверить объявления
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_SECONDS: "480"   # после поиска ещё 8 минут отвечать на сообщения сразу
        run: python bot.py

      - name: Сохранить просмотренные
        if: always()
        run: |
          [ -f seen.json ] || exit 0
          git config user.name "flat-bot"
          git config user.email "flat-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "seen: $(date -u +%F\ %H:%M)" && git pull --rebase && git push)
