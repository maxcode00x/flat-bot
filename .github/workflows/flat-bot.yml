name: Поиск жилья

on:
  workflow_dispatch:          # ручной запуск и автоперезапуск в конце каждого круга
  schedule:
    - cron: "*/30 * * * *"    # запасной вариант: поднимет бота, если цепочка оборвалась

permissions:
  contents: write             # сохранять seen.json
  actions: write              # запускать следующий круг

concurrency:
  group: flat-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Бот (поиск каждые 10 минут, ответы на сообщения сразу)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_SECONDS: "1440"   # один круг — 24 минуты
          SEARCH_EVERY: "600"   # поиск объявлений раз в 10 минут
        run: python bot.py

      - name: Сохранить данные
        if: always()
        run: |
          [ -f seen.json ] || exit 0
          git config user.name "flat-bot"
          git config user.email "flat-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "data $(date -u +%F\ %H:%M)" && git pull --rebase && git push)

      - name: Запустить следующий круг
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run flat-bot.yml --ref "${{ github.ref_name }}"
