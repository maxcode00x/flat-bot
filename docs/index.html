<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Filtry · Flat bot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f1f2f6);
    --fg: var(--tg-theme-text-color, #16181d);
    --hint: var(--tg-theme-hint-color, #8a8f9c);
    --accent: var(--tg-theme-button-color, #2e7cf6);
    --accent-fg: var(--tg-theme-button-text-color, #ffffff);
    --line: color-mix(in srgb, var(--hint) 28%, transparent);
    --chip: color-mix(in srgb, var(--hint) 14%, var(--bg));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg2); color: var(--fg);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 12px 96px; display: flex; flex-direction: column; gap: 12px; }
  section { background: var(--bg); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  h2 { margin: 0; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .label { font-weight: 600; }
  .hint { color: var(--hint); font-size: 12.5px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--chip); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { border: 0; background: transparent; color: var(--fg); padding: 9px 6px; border-radius: 8px; font: inherit; font-weight: 500; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 999px;
    padding: 7px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .range { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
  input[type=number], input[type=text], select, textarea { width: 100%; border: 1px solid var(--line); background: var(--bg);
    color: var(--fg); border-radius: 10px; padding: 10px 12px; font: inherit; min-width: 0; }
  textarea { resize: vertical; min-height: 64px; }
  .switch { display: flex; justify-content: space-between; align-items: center; gap: 12px; cursor: pointer; }
  .switch input { appearance: none; width: 46px; height: 28px; border-radius: 999px; background: var(--chip);
    border: 1px solid var(--line); position: relative; flex: none; cursor: pointer; transition: background .15s; }
  .switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .15s; }
  .switch input:checked { background: var(--accent); border-color: var(--accent); }
  .switch input:checked::after { left: 20px; }
  .zone { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .zone:first-of-type { border-top: 0; padding-top: 0; }
  .zone-head { display: flex; justify-content: space-between; align-items: center; }
  .link { border: 0; background: none; color: var(--accent); font: inherit; font-size: 13.5px; padding: 4px 0; cursor: pointer; }
  .badge { font-size: 11px; font-weight: 600; color: var(--hint); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px; }
  .paused { background: color-mix(in srgb, #f5a623 18%, var(--bg)); }
  #save { position: fixed; left: 12px; right: 12px; bottom: 12px; max-width: 616px; margin: 0 auto; border: 0; border-radius: 12px;
    padding: 14px; background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 600; font-size: 16px; cursor: pointer; }
  #err { color: #e5484d; font-size: 13.5px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="pauseBox">
    <label class="switch"><span><span class="label" data-i18n="pause_title"></span><br><span class="hint" data-i18n="pause_hint"></span></span><input type="checkbox" id="paused"></label>
  </section>

  <section id="profBox">
    <h2 data-i18n="h_prof"></h2>
    <div class="seg" id="ptabs">
      <button type="button" data-v="0">1</button>
      <button type="button" data-v="1">2</button>
      <button type="button" data-v="2">3</button>
    </div>
    <input type="text" id="pname" maxlength="30" data-i18n-ph="ph_prof_name">
    <label class="switch"><span data-i18n="prof_on"></span><input type="checkbox" id="pon"></label>
    <div class="hint" data-i18n="prof_hint"></div>
  </section>

  <section>
    <h2 data-i18n="h_what"></h2>
    <div class="seg" id="type">
      <button type="button" data-v="flat" data-i18n="t_flat"></button>
      <button type="button" data-v="room" data-i18n="t_room"></button>
      <button type="button" data-v="both" data-i18n="t_both"></button>
    </div>
    <div class="row"><span class="label" data-i18n="l_where"></span></div>
    <div class="chips" id="src">
      <button type="button" class="chip" data-v="olx">OLX</button>
      <button type="button" class="chip" data-v="otodom">Otodom</button>
      <button type="button" class="chip" data-v="domiporta">Domiporta</button>
      <button type="button" class="chip" data-v="nol">Nieruchomosci-online</button>
      <button type="button" class="chip" data-v="gratka">Gratka/Morizon</button>
    </div>
    <div class="hint" data-i18n="src_hint"></div>
    <div class="row"><span class="label" data-i18n="l_city"></span></div>
    <select id="city">
      <option value="szczecin">Szczecin</option><option value="warszawa">Warszawa</option>
      <option value="krakow">Kraków</option><option value="wroclaw">Wrocław</option>
      <option value="poznan">Poznań</option><option value="gdansk">Gdańsk</option>
      <option value="gdynia">Gdynia</option><option value="lodz">Łódź</option>
      <option value="katowice">Katowice</option><option value="lublin">Lublin</option>
      <option value="bydgoszcz">Bydgoszcz</option><option value="bialystok">Białystok</option>
    </select>
  </section>

  <section id="distBox">
    <h2 data-i18n="h_dist"></h2>
    <div class="hint" data-i18n="dist_hint"></div>
    <div id="zones"></div>
    <label class="switch"><span><span data-i18n="nodist"></span><br><span class="hint" data-i18n="nodist_hint"></span></span><input type="checkbox" id="noDist"></label>
  </section>

  <section>
    <h2 data-i18n="h_price"></h2>
    <div class="label" data-i18n="l_rent"></div>
    <div class="range"><input type="number" id="pMin" inputmode="numeric" data-i18n-ph="ph_from"><span class="hint">—</span><input type="number" id="pMax" inputmode="numeric" data-i18n-ph="ph_to"></div>
    <div class="label" data-i18n="l_total"></div>
    <input type="number" id="tMax" inputmode="numeric" data-i18n-ph="ph_total">
    <div class="hint" data-i18n="total_hint"></div>
  </section>

  <section id="flatBox">
    <h2 data-i18n="h_flat"></h2>
    <div class="label" data-i18n="l_rooms"></div>
    <div class="chips" id="rooms">
      <button type="button" class="chip" data-v="1">1 (kawalerka)</button>
      <button type="button" class="chip" data-v="2">2</button>
      <button type="button" class="chip" data-v="3">3</button>
      <button type="button" class="chip" data-v="4">4+</button>
    </div>
    <div class="label" data-i18n="l_area"></div>
    <div class="range"><input type="number" id="aMin" inputmode="numeric" data-i18n-ph="ph_from"><span class="hint">—</span><input type="number" id="aMax" inputmode="numeric" data-i18n-ph="ph_to"></div>
    <div class="label" data-i18n="l_floor"></div>
    <div class="chips" id="floors"></div>
    <div class="label" data-i18n="l_bt"></div>
    <div class="chips" id="bt">
      <button type="button" class="chip" data-v="BLOCK">Blok</button>
      <button type="button" class="chip" data-v="TENEMENT">Kamienica</button>
      <button type="button" class="chip" data-v="APARTMENT">Apartamentowiec</button>
      <button type="button" class="chip" data-v="HOUSE" data-i18n="bt_house"></button>
      <button type="button" class="chip" data-v="LOFT">Loft</button>
      <button type="button" class="chip" data-v="OTHER" data-i18n="other"></button>
    </div>
    <div class="label" data-i18n="l_heat"></div>
    <div class="chips" id="heat">
      <button type="button" class="chip" data-v="URBAN" data-i18n="heat_urban"></button>
      <button type="button" class="chip" data-v="GAS" data-i18n="heat_gas"></button>
      <button type="button" class="chip" data-v="ELECTRICAL" data-i18n="heat_el"></button>
      <button type="button" class="chip" data-v="BOILER_ROOM" data-i18n="heat_boiler"></button>
      <button type="button" class="chip" data-v="TILED_STOVE" data-i18n="heat_stove"></button>
      <button type="button" class="chip" data-v="OTHER" data-i18n="other"></button>
    </div>
    <div class="hint" data-i18n="heat_hint"></div>
    <div class="label" data-i18n="l_ex"></div>
    <div class="chips" id="ex">
      <button type="button" class="chip" data-v="BALCONY" data-i18n="ex_balcony"></button>
      <button type="button" class="chip" data-v="LIFT" data-i18n="ex_lift"></button>
      <button type="button" class="chip" data-v="GARAGE" data-i18n="ex_garage"></button>
      <button type="button" class="chip" data-v="SEPARATE_KITCHEN" data-i18n="ex_kitchen"></button>
      <button type="button" class="chip" data-v="AIR_CONDITIONING" data-i18n="ex_ac"></button>
      <button type="button" class="chip" data-v="TERRACE" data-i18n="ex_terrace"></button>
      <button type="button" class="chip" data-v="GARDEN" data-i18n="ex_garden"></button>
      <button type="button" class="chip" data-v="INTERNET" data-i18n="ex_internet"></button>
    </div>
    <div class="hint" data-i18n="ex_hint"></div>
    <label class="switch"><span><span data-i18n="l_pets"></span> <span class="badge">OLX</span></span><input type="checkbox" id="pets"></label>
    <div class="label"><span data-i18n="l_year"></span> <span class="badge">Otodom</span></div>
    <input type="number" id="yearMin" inputmode="numeric" data-i18n-ph="ph_year">
  </section>

  <section id="roomBox">
    <h2 data-i18n="h_room"></h2>
    <div class="label" data-i18n="l_ppl"></div>
    <div class="chips" id="ppl">
      <button type="button" class="chip" data-v="1">1</button>
      <button type="button" class="chip" data-v="2">2</button>
      <button type="button" class="chip" data-v="3">3</button>
    </div>
    <div class="label"><span data-i18n="l_pref"></span> <span class="badge">OLX</span></div>
    <select id="pref">
      <option value="" data-i18n="pref_any"></option>
      <option value="man" data-i18n="pref_man"></option>
      <option value="women" data-i18n="pref_women"></option>
      <option value="student" data-i18n="pref_student"></option>
      <option value="working" data-i18n="pref_working"></option>
    </select>
    <div class="hint" data-i18n="pref_hint"></div>
  </section>

  <section>
    <h2 data-i18n="h_more"></h2>
    <label class="switch"><span><span data-i18n="l_furn"></span> <span class="badge">OLX · Nieruchomosci-online</span></span><input type="checkbox" id="furn"></label>
    <label class="switch"><span><span data-i18n="l_priv"></span><br><span class="hint" data-i18n="priv_hint"></span></span><input type="checkbox" id="priv"></label>
    <div class="label" data-i18n="l_excl"></div>
    <textarea id="excl" placeholder="tylko dla kobiet, na doby, krótkoterminowy"></textarea>
    <div class="label" data-i18n="l_incl"></div>
    <textarea id="incl" data-i18n-ph="ph_incl"></textarea>
    <div class="hint" data-i18n="words_hint"></div>
    <div class="label" data-i18n="l_first"></div>
    <div class="seg" id="first">
      <button type="button" data-v="0">0</button>
      <button type="button" data-v="3">3</button>
      <button type="button" data-v="5">5</button>
      <button type="button" data-v="10">10</button>
      <button type="button" data-v="999" data-i18n="all_btn"></button>
    </div>
    <div class="hint" data-i18n="first_hint"></div>
  </section>

  <section>
    <h2 data-i18n="h_me"></h2>
    <div class="hint" data-i18n="me_hint"></div>
    <div class="label" data-i18n="me_name"></div>
    <input type="text" id="meName" maxlength="40" placeholder="Maksim">
    <div class="label" data-i18n="me_move"></div>
    <input type="text" id="meMove" maxlength="40" data-i18n-ph="ph_move">
    <div class="label" data-i18n="me_people"></div>
    <div class="seg" id="mePeople">
      <button type="button" data-v="">—</button>
      <button type="button" data-v="1">1</button>
      <button type="button" data-v="2">2</button>
      <button type="button" data-v="3">3</button>
      <button type="button" data-v="4">4+</button>
    </div>
    <div class="label" data-i18n="me_job"></div>
    <select id="meJob">
      <option value="" data-i18n="opt_none"></option>
      <option value="work" data-i18n="job_work"></option>
      <option value="study" data-i18n="job_study"></option>
      <option value="both" data-i18n="job_both"></option>
    </select>
    <div class="label" data-i18n="me_pets"></div>
    <select id="mePets">
      <option value="" data-i18n="opt_none"></option>
      <option value="no" data-i18n="pets_no"></option>
      <option value="cat" data-i18n="pets_cat"></option>
      <option value="dog" data-i18n="pets_dog"></option>
      <option value="small" data-i18n="pets_small"></option>
    </select>
    <label class="switch"><span data-i18n="me_smoke"></span><input type="checkbox" id="meSmoke"></label>
    <div class="label" data-i18n="me_note"></div>
    <textarea id="meNote" maxlength="200" data-i18n-ph="ph_note"></textarea>
  </section>

  <section>
    <h2 data-i18n="h_quiet"></h2>
    <label class="switch"><span data-i18n="quiet_on"></span><input type="checkbox" id="qOn"></label>
    <div class="range"><select id="qFrom"></select><span class="hint">—</span><select id="qTo"></select></div>
    <div class="hint" data-i18n="quiet_hint"></div>
    <div id="err" role="alert"></div>
  </section>
</main>
<button type="button" id="save" data-i18n="save"></button>

  const me = s.me || {};
  $("meName").value = me.name || ""; $("meMove").value = me.move || ""; setSeg("mePeople", me.people ? Math.min(me.people, 4) : "");
  $("meJob").value = me.job || ""; $("mePets").value = me.pets || ""; $("meSmoke").checked = me.smoke === "no"; $("meNote").value = me.note || "";
}
function readSettings() {
  const ppl = getSeg("mePeople");
  return {paused: $("paused").checked,
          quiet: {on: $("qOn").checked, from: Number($("qFrom").value), to: Number($("qTo").value)},
          me: {name: $("meName").value.trim(), move: $("meMove").value.trim(), people: ppl ? Number(ppl) : null,
               job: $("meJob").value, pets: $("mePets").value, smoke: $("meSmoke").checked ? "no" : "", note: $("meNote").value.trim()}};
}

loadSettings(settings);
loadProfile(profiles[0]);
refreshTabs();

// ---- события
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.closest("#ptabs")) {
    profiles[curIdx] = readProfile(); curIdx = Number(b.dataset.v);
    loadProfile(profiles[curIdx]); refreshTabs(); haptic(); return;
  }
  if (b.closest(".seg")) { setSeg(b.closest(".seg").id, b.dataset.v); refreshVisibility(); haptic(); return; }
  if (b.classList.contains("chip")) { pressed(b, b.getAttribute("aria-pressed") !== "true"); refreshZones(); haptic(); return; }
  if (b.dataset.zone) {
    const chips = [...b.closest(".zone").querySelectorAll(".chip")];
    const allOn = chips.every(c => c.getAttribute("aria-pressed") === "true");
    chips.forEach(c => pressed(c, !allOn)); refreshZones(); haptic(); return;
  }
});
$("city").addEventListener("change", refreshVisibility);
$("paused").addEventListener("change", refreshVisibility);
$("pon").addEventListener("change", () => { profiles[curIdx].on = $("pon").checked; refreshTabs(); });
$("pname").addEventListener("input", () => { profiles[curIdx].name = $("pname").value.trim(); refreshTabs(); });
function haptic() { try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (e) {} }

function collect() {
  profiles[curIdx] = readProfile();
  const err = [];
  const many = profiles.filter(x => x.on).length > 1;
  profiles.forEach((p, i) => {
    if (!p.on) return;
    const n = many ? " (" + (p.name || i + 1) + ")" : "";
    if (!p.src.length) err.push(L.err_src + n);
    if (p.pMin && p.pMax && p.pMin > p.pMax) err.push(L.err_price + n);
    if (p.aMin && p.aMax && p.aMin > p.aMax) err.push(L.err_area + n);
  });
  const out = profiles.map(p => {
    const q = {...p, dist: (p.dist || []).map(d => ALL.indexOf(d)).filter(i => i >= 0)};
    return q.on ? q : {on: false, name: q.name};
  });
  while (out.length > 1 && !out[out.length - 1].on && !out[out.length - 1].name) out.pop();
  return {data: {v: 3, s: readSettings(), p: out}, err};
}

function save() {
  const {data, err} = collect();
  $("err").textContent = err.join(" ");
  if (err.length) { try { tg && tg.HapticFeedback.notificationOccurred("error"); } catch (e) {} return; }
  const json = JSON.stringify(data);
  if (tg && tg.sendData && tg.initData !== undefined && tg.platform !== "unknown") {
    try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
    tg.sendData(json);              // Telegram закроет окно и передаст фильтры боту
  } else {
    $("err").textContent = L.open_in_tg;
    console.log(json);
  }
}
$("save").addEventListener("click", save);
if (tg && tg.MainButton) {
  $("save").hidden = true;
  tg.MainButton.setText(L.save);
  tg.MainButton.onClick(save);
  tg.MainButton.show();
}
</script>
</body>
</html>
